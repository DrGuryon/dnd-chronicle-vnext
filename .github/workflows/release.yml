name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Ensure all public release assets are attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $assets = @(
            Get-Item -LiteralPath "release\D&D-Chronicle-vNext-Setup-$releaseVersion.exe"
            Get-Item -LiteralPath "release\D&D-Chronicle-vNext-Setup-$releaseVersion.exe.blockmap"
            Get-Item -LiteralPath 'release\latest.yml'
          )
          gh release upload $env:GITHUB_REF_NAME @($assets.FullName) --clobber
      - uses: actions/upload-artifact@v6
        with:
          name: dnd-chronicle-vnext-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
