name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Ensure all public release assets are attached
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $canonicalInstaller = "release\dnd-chronicle-vnext-setup-$releaseVersion.exe"
          $canonicalBlockmap = "$canonicalInstaller.blockmap"
          Copy-Item -LiteralPath "release\D&D-Chronicle-vNext-Setup-$releaseVersion.exe" -Destination $canonicalInstaller
          Copy-Item -LiteralPath "release\D&D-Chronicle-vNext-Setup-$releaseVersion.exe.blockmap" -Destination $canonicalBlockmap

          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME" | ConvertFrom-Json
          foreach ($asset in $release.assets | Where-Object { $_.name -like 'D.D-Chronicle-vNext-Setup-*' }) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
          }

          $assets = @(
            Get-Item -LiteralPath $canonicalInstaller
            Get-Item -LiteralPath $canonicalBlockmap
            Get-Item -LiteralPath 'release\latest.yml'
          )
          gh release upload $env:GITHUB_REF_NAME @($assets.FullName) --clobber
      - uses: actions/upload-artifact@v6
        with:
          name: dnd-chronicle-vnext-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
